name: Vendor isle-overlay HUD once

on:
  push:
    branches:
      - chore/vendor-isle-overlay-hud

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/vendor-isle-overlay-hud

      - name: Download migration artifact
        env:
          HUD_ARCHIVE_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-4e60-8230-bca2-3d41e0f10055/raw?se=2026-08-28T15%3A34%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=cb91c237-f615-53b2-9de6-dcd88ff66f9d&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A34%3A21Z&ske=2026-08-29T03%3A34%3A21Z&sks=b&skv=2026-02-06&sig=Wbql7otWV515U3Vv21ykn/n/WUkkHcldsn/HYnU/nA4%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$HUD_ARCHIVE_URL" -o /tmp/hud-migration.zip
          rm -rf /tmp/hud-migration
          mkdir -p /tmp/hud-migration
          unzip -q /tmp/hud-migration.zip -d /tmp/hud-migration
          test -f /tmp/hud-migration/src/App.tsx
          test -f /tmp/hud-migration/src/MainWindow.tsx
          test -f /tmp/hud-migration/src/RadarPanel.tsx

      - name: Vendor HUD source
        run: |
          set -euo pipefail
          rm -rf modules/hud/upstream-src modules/hud/upstream-dist
          mkdir -p modules/hud/upstream-src/public
          cp -R /tmp/hud-migration/src modules/hud/upstream-src/src
          rm -rf modules/hud/upstream-src/src/launcher
          cp /tmp/hud-migration/index.html modules/hud/upstream-src/index.html
          cp /tmp/hud-migration/tsconfig.json modules/hud/upstream-src/tsconfig.json
          cp /tmp/hud-migration/public/yeti-logo.webp modules/hud/upstream-src/public/yeti-logo.webp

          cat > modules/hud/upstream-src/package.json <<'EOF'
          {
            "name": "dino-community-vendored-isle-overlay-hud",
            "private": true,
            "version": "0.4.0",
            "type": "module",
            "scripts": {
              "build": "tsc --noEmit --pretty false && vite build"
            },
            "dependencies": {
              "@react-three/drei": "^10.7.7",
              "@react-three/fiber": "^9.6.1",
              "react": "^19.2.7",
              "react-dom": "^19.2.7",
              "three": "^0.184.1"
            },
            "devDependencies": {
              "@types/node": "^22.15.21",
              "@types/react": "^19.2.17",
              "@types/react-dom": "^19.2.3",
              "@types/three": "^0.184.1",
              "@vitejs/plugin-react": "^4.3.4",
              "typescript": "^5.8.3",
              "vite": "^5.4.19"
            }
          }
          EOF

          cat > modules/hud/upstream-src/vite.config.ts <<'EOF'
          import { defineConfig } from "vite";
          import react from "@vitejs/plugin-react";
          import { readFileSync } from "node:fs";
          import { fileURLToPath } from "node:url";
          import { resolve } from "node:path";

          const pkg = JSON.parse(readFileSync(new URL("./package.json", import.meta.url), "utf8"));
          const rootDir = fileURLToPath(new URL(".", import.meta.url));

          export default defineConfig({
            base: "./",
            plugins: [react()],
            define: { __APP_VERSION__: JSON.stringify(pkg.version) },
            build: {
              outDir: "../upstream-dist",
              emptyOutDir: true,
              rollupOptions: { input: { overlay: resolve(rootDir, "index.html") } },
            },
          });
          EOF

      - name: Replace HUD preparation with vendored build
        run: |
          cat > scripts/prepare-upstream-hud.js <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { spawnSync } = require('child_process');

          const ROOT = path.resolve(__dirname, '..');
          const SOURCE_ROOT = path.join(ROOT, 'modules', 'hud', 'upstream-src');
          const OUTPUT_ROOT = path.join(ROOT, 'modules', 'hud', 'upstream-dist');
          const BUILD_META = path.join(OUTPUT_ROOT, '.build-meta.json');
          const force = process.argv.includes('--force');

          function run(command, args, cwd) {
            const result = spawnSync(command, args, {
              cwd,
              stdio: 'inherit',
              shell: process.platform === 'win32'
            });
            if (result.status !== 0) {
              throw new Error(`${command} ${args.join(' ')} failed with code ${result.status}`);
            }
          }

          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === 'dist') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(full));
              else out.push(full);
            }
            return out.sort();
          }

          function fingerprint() {
            const hash = crypto.createHash('sha256');
            for (const file of walk(SOURCE_ROOT)) {
              hash.update(path.relative(SOURCE_ROOT, file).replaceAll('\\', '/'));
              hash.update(fs.readFileSync(file));
            }
            return hash.digest('hex');
          }

          function readMeta() {
            try { return JSON.parse(fs.readFileSync(BUILD_META, 'utf8')); }
            catch { return null; }
          }

          function main() {
            if (!fs.existsSync(path.join(SOURCE_ROOT, 'src', 'App.tsx'))) {
              throw new Error('Vendored isle-overlay HUD source is missing. Run git pull again.');
            }

            const nodeModules = path.join(SOURCE_ROOT, 'node_modules');
            if (!fs.existsSync(nodeModules)) {
              console.log('[HUD] Installing dependencies for vendored isle-overlay HUD...');
              run('npm', ['install', '--ignore-scripts', '--no-audit', '--no-fund'], SOURCE_ROOT);
            }

            const hash = fingerprint();
            const meta = readMeta();
            const ready = fs.existsSync(path.join(OUTPUT_ROOT, 'index.html'));
            if (!force && ready && meta?.sourceHash === hash) {
              console.log(`[HUD] Vendored HUD already built (${hash.slice(0, 12)}).`);
              return;
            }

            console.log('[HUD] Building HUD directly from modules/hud/upstream-src...');
            run('npm', ['run', 'build'], SOURCE_ROOT);
            fs.mkdirSync(OUTPUT_ROOT, { recursive: true });
            fs.writeFileSync(BUILD_META, `${JSON.stringify({ sourceHash: hash, builtAt: new Date().toISOString() }, null, 2)}\n`);
            console.log('[HUD] HUD build ready.');
          }

          try { main(); }
          catch (error) {
            console.error('[HUD] Vendored HUD build failed:', error.message || error);
            process.exit(1);
          }
          EOF

          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '0.5.0';
          pkg.description = 'Dino Community desktop launcher for The Isle with a vendored isle-overlay HUD, server query, game monitoring, system tray, module management and automatic updates.';
          pkg.scripts['hud:prepare'] = 'node scripts/prepare-upstream-hud.js';
          pkg.scripts['hud:rebuild'] = 'node scripts/prepare-upstream-hud.js --force';
          delete pkg.scripts['hud:sync'];
          pkg.scripts.prestart = 'npm run hud:prepare';
          pkg.scripts.predev = 'npm run hud:prepare';
          pkg.scripts['dist:dir'] = 'npm run hud:prepare && electron-builder --dir';
          pkg.scripts.dist = 'npm run hud:prepare && electron-builder --win nsis';
          pkg.scripts.publish = 'npm run hud:prepare && electron-builder --win nsis --publish always';
          pkg.scripts.check = 'node --check electron/main.js && node --check electron/preload.js && node --check electron/services/config-service.js && node --check electron/services/game-service.js && node --check electron/services/server-service.js && node --check electron/services/updater-service.js && node --check electron/services/logger-service.js && node --check electron/services/module-manager.js && node --check electron/services/tray-service.js && node --check src/renderer.js && node --check src/settings-ui.js && node --check modules/hud/index.js && node --check modules/hud/host-preload.js && node --check scripts/prepare-upstream-hud.js';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          cat > modules/hud/README.md <<'EOF'
          # HUD module — vendored from isle-overlay-main

          The launcher no longer generates or clones a second HUD implementation.

          The complete HUD source used by the launcher is committed under:

          ```text
          modules/hud/upstream-src/
          ```

          It was migrated from `t-Gibsonn12/isle-overlay-main` and remains the implementation for StatsWidget, Prime, Radar/mini map, MainWindow, draggable widgets, appearance controls and the existing overlay UI.

          `modules/hud/index.js` is only the Electron host/lifecycle adapter. `host-preload.js` exposes the compatibility bridge expected by the original HUD.

          ## Build

          `npm start`, `npm run dist` and `npm run publish` call `npm run hud:prepare` automatically. On the first run the HUD subproject installs its frontend-only dependencies and builds to:

          ```text
          modules/hud/upstream-dist/
          ```

          Force a rebuild with:

          ```bash
          npm run hud:rebuild
          ```

          There is no runtime Git clone, no cache checkout and no hand-made replacement HUD.
          EOF

      - name: Commit vendored HUD source
        run: |
          set -euo pipefail
          rm -f .github/workflows/vendor-hud-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Vendor original isle-overlay HUD source into launcher"
          git push origin HEAD:chore/vendor-isle-overlay-hud
