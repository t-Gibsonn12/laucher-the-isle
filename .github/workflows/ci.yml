name: Launcher CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Test HUD runtime bridge
        run: npm test

      - name: Build unpacked Windows launcher
        run: npm run dist:dir
