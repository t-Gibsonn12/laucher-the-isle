<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Community HUD</title>
    <link rel="stylesheet" href="fallback.css" />
  </head>
  <body>
    <main id="hud" class="hud">
      <section class="radar hud-card">
        <div class="card-title"><span class="dot"></span> RADAR <small id="radar-status">ĐANG KẾT NỐI</small></div>
        <div class="radar-disc"><span class="radar-north">N</span><span id="radar-arrow" class="radar-arrow">▲</span><span class="radar-self">●</span></div>
      </section>

      <section class="stats hud-card">
        <div class="card-title"><span class="dot"></span> CHỈ SỐ <small id="species">ĐANG TẢI</small></div>
        <div id="stat-rows" class="stat-rows"></div>
      </section>

      <section class="prime hud-card">
        <div class="card-title"><span class="dot"></span> PRIME <small id="prime-count">0/5</small></div>
        <div id="prime-status" class="prime-status">Đang đọc dữ liệu nhân vật…</div>
      </section>

      <button id="status-pill" class="status-pill" title="Mở dashboard bằng F8"><span id="signal" class="signal"></span><span id="status-label">HUD ĐANG CHẠY</span></button>

      <section id="dashboard" class="dashboard interactive-region" hidden>
        <header><span>DINO COMMUNITY</span><button id="close-dashboard" class="interactive-region" title="Đóng">ĐÓNG</button></header>
        <div class="dash-body">
          <h1>HUD trong game</h1>
          <p id="dash-state">Đang đồng bộ với The Isle…</p>
          <div class="key-row"><kbd>F8</kbd><span>Mở / đóng dashboard</span></div>
          <div class="key-row"><kbd>F9</kbd><span>Ẩn / hiện toàn bộ HUD</span></div>
          <p class="dash-note">Đang dùng renderer ổn định để HUD không bị treo khi game chạy.</p>
        </div>
      </section>
    </main>
    <script src="fallback.js"></script>
  </body>
</html>
