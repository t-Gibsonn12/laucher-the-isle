<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-label="Dark prehistoric jungle with dinosaur silhouette">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1712"/>
      <stop offset="0.48" stop-color="#07110d"/>
      <stop offset="1" stop-color="#020705"/>
    </linearGradient>
    <radialGradient id="mist" cx="64%" cy="40%" r="48%">
