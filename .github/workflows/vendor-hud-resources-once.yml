name: Vendor HUD resources once

on:
  push:
    branches:
      - chore/vendor-isle-overlay-hud

permissions:
  contents: write

jobs:
  vendor-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/vendor-isle-overlay-hud

      - name: Download HUD resources migration artifact
        env:
          HUD_ARCHIVE_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-0ba0-81f5-b0a9-4affdd35ab22/raw?se=2026-08-28T15%3A45%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=621f336c-91c2-59e5-ae8c-25612d5f1928&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A28%3A37Z&ske=2026-08-29T03%3A28%3A37Z&sks=b&skv=2026-02-06&sig=EE2D2SkxeSLDWQpjNVPPrT/%2BZ2LvDDlDffwjrcgM4bs%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$HUD_ARCHIVE_URL" -o /tmp/hud-resources.zip
          rm -rf /tmp/hud-resources
          mkdir -p /tmp/hud-resources
          unzip -q /tmp/hud-resources.zip -d /tmp/hud-resources
          test -f /tmp/hud-resources/resources/sm_files.json
          test -f /tmp/hud-resources/resources/bp_files.json
          test -f /tmp/hud-resources/resources/mat_files.json

      - name: Copy original map resources
        run: |
          set -euo pipefail
          mkdir -p modules/hud/upstream-src/resources
          cp /tmp/hud-resources/resources/sm_files.json modules/hud/upstream-src/resources/sm_files.json
          cp /tmp/hud-resources/resources/bp_files.json modules/hud/upstream-src/resources/bp_files.json
          cp /tmp/hud-resources/resources/mat_files.json modules/hud/upstream-src/resources/mat_files.json

      - name: Commit resources
        run: |
          set -euo pipefail
          rm -f .github/workflows/vendor-hud-resources-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Vendor original HUD map resources"
          git push origin HEAD:chore/vendor-isle-overlay-hud
